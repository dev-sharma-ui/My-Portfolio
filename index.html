<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dev Sharma — ML Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020408;font-family:'DM Sans',sans-serif;color:#fff}
canvas{position:fixed;inset:0;z-index:0;cursor:none}
#ci{position:fixed;top:0;left:0;width:7px;height:7px;background:#fff;border-radius:50%;pointer-events:none;z-index:9999;mix-blend-mode:difference;will-change:transform}
#co{position:fixed;top:0;left:0;width:32px;height:32px;border:1px solid rgba(255,255,255,0.5);border-radius:50%;pointer-events:none;z-index:9998;will-change:transform;transition:width .15s,height .15s}

/* intro */
#intro{position:fixed;inset:0;z-index:300;background:#020408;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 1s ease}
#intro.gone{opacity:0;pointer-events:none}
.i-name{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(3.5rem,9vw,7rem);letter-spacing:-.04em;color:#fff;line-height:1;opacity:0;transform:translateY(28px);transition:all 1.1s cubic-bezier(.22,1,.36,1)}
.i-name.vis{opacity:1;transform:translateY(0)}
.i-role{font-family:'JetBrains Mono',monospace;font-size:.85rem;letter-spacing:.22em;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-top:1rem;opacity:0;transition:opacity .8s ease .6s}
.i-role.vis{opacity:1}
.i-hint{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:rgba(255,255,255,0.18);margin-top:3rem;letter-spacing:.08em;opacity:0;transition:opacity .8s ease 1.3s;animation:breathe 3s ease-in-out 1.3s infinite}
.i-hint.vis{opacity:1}
@keyframes breathe{0%,100%{opacity:.15}50%{opacity:.4}}

/* node labels */
.nlabel{position:fixed;pointer-events:none;z-index:20;font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,0.35);transform:translate(-50%,-50%);white-space:nowrap;transition:color .25s,opacity .3s,text-shadow .25s;user-select:none;font-weight:500}
.nlabel.clickable{pointer-events:all;cursor:pointer}
.nlabel.hover{color:rgba(255,255,255,.95);text-shadow:0 0 16px rgba(255,255,255,.4)}

/* bottom bar */
#bar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;pointer-events:none;background:linear-gradient(transparent,rgba(2,4,8,.6))}
.bar-l{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;color:rgba(255,255,255,.2);letter-spacing:-.01em}
.bar-c{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:rgba(255,255,255,.12);letter-spacing:.1em;text-align:center}
.bar-r{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:rgba(255,255,255,.12)}

/* panel */
#panel{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s ease}
#panel.open{opacity:1;pointer-events:all}
#pbg{position:absolute;inset:0;background:rgba(2,4,8,.93);backdrop-filter:blur(30px);cursor:pointer}
#pbox{
  position:relative;z-index:2;
  width:min(860px,94vw);max-height:88vh;
  overflow-y:auto;background:#060a12;
  border:1px solid rgba(255,255,255,.09);
  padding:3rem 3.5rem;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent;
  transform:translateY(20px);transition:transform .35s cubic-bezier(.22,1,.36,1);
}
#panel.open #pbox{transform:translateY(0)}
#pbox::-webkit-scrollbar{width:2px}
#pbox::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08)}
#pcls{position:absolute;top:1.5rem;right:1.5rem;width:36px;height:36px;border:1px solid rgba(255,255,255,.15);background:none;color:rgba(255,255,255,.45);font-family:'JetBrains Mono',monospace;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
#pcls:hover{border-color:rgba(255,255,255,.55);color:#fff}

/* ── PANEL TYPOGRAPHY (ALL BIGGER + READABLE) ── */
.ptag{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);display:block;margin-bottom:1.25rem}
.ph1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2.4rem,5vw,3.8rem);color:#fff;line-height:1.05;letter-spacing:-.03em;margin-bottom:1.75rem}
.ph1 .ghost{-webkit-text-stroke:1.5px rgba(255,255,255,.2);color:transparent}
.ph2{font-family:'Syne',sans-serif;font-weight:700;font-size:1.15rem;color:rgba(255,255,255,.85);margin:2rem 0 .75rem}
.pbody{font-size:1rem;line-height:1.9;color:rgba(255,255,255,.55)}
.pbody strong{color:rgba(255,255,255,.85);font-weight:500}
.pbody a{color:rgba(255,255,255,.65);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.2);transition:color .2s}
.pbody a:hover{color:#fff}
.pdiv{height:1px;background:rgba(255,255,255,.07);margin:2rem 0}

/* timeline */
.tl .row{display:flex;gap:1.5rem;padding:1rem 0;border-bottom:1px solid rgba(255,255,255,.05)}
.tl .row:last-child{border:none}
.tl .yr{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:rgba(255,255,255,.28);min-width:44px;padding-top:3px;flex-shrink:0}
.tl .et{font-family:'Syne',sans-serif;font-weight:600;font-size:.98rem;color:rgba(255,255,255,.78)}
.tl .ed{font-family:'DM Sans',sans-serif;font-size:.88rem;color:rgba(255,255,255,.32);margin-top:3px;line-height:1.6}

/* skill grid */
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:1px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.05);margin-bottom:2rem;margin-top:.75rem}
.ski{padding:1rem .9rem;background:#060a12;transition:background .2s}
.ski:hover{background:#0c1120}
.skn{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:rgba(255,255,255,.6)}
.skbb{height:1px;background:rgba(255,255,255,.08);margin-top:.55rem;overflow:hidden}
.skb{height:100%;background:rgba(255,255,255,.6);transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.22,1,.36,1)}

/* projects */
.proj{padding:1.6rem;background:#060a12;border:1px solid rgba(255,255,255,.06);margin-bottom:1px;transition:background .2s;display:grid;grid-template-columns:1fr auto;gap:1rem}
.proj:hover{background:#0b1020}
.pjt{font-family:'Syne',sans-serif;font-weight:700;font-size:1.05rem;color:rgba(255,255,255,.85);margin-bottom:.4rem}
.pjd{font-size:.9rem;line-height:1.75;color:rgba(255,255,255,.42)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:.8rem}
.tag{font-family:'JetBrains Mono',monospace;font-size:.65rem;padding:2px 8px;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.38)}
.plink{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:rgba(255,255,255,.28);text-decoration:none;display:block;margin-top:.7rem;transition:color .2s}
.plink:hover{color:rgba(255,255,255,.75)}
.pstat{text-align:right;flex-shrink:0}
.psv{font-family:'Syne',sans-serif;font-weight:700;font-size:1.3rem;color:rgba(255,255,255,.65)}
.psl{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:rgba(255,255,255,.28);margin-top:2px}

/* competitive */
.cprow{display:flex;align-items:center;gap:1.25rem;padding:1rem 0;border-bottom:1px solid rgba(255,255,255,.05)}
.cprow:last-child{border:none}
.cpico{font-size:1.3rem;min-width:36px}
.cpt{font-family:'Syne',sans-serif;font-weight:600;font-size:.95rem;color:rgba(255,255,255,.72)}
.cpd{font-family:'DM Sans',sans-serif;font-size:.88rem;color:rgba(255,255,255,.32);margin-top:2px}
.cpbadge{font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:3px 9px;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);margin-left:auto;flex-shrink:0}

/* github stats */
.ghg{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.05);margin-top:1.5rem}
.ghg .w{grid-column:1/-1}
.ghc{background:#060a12;padding:1rem;display:flex;justify-content:center}
.ghc img{width:100%;border-radius:3px;opacity:.85;max-height:175px;object-fit:contain}

/* contact */
.ci{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.1);padding:.85rem 0;font-family:'JetBrains Mono',monospace;font-size:.85rem;color:rgba(255,255,255,.7);outline:none;transition:border-color .2s;margin-bottom:1.4rem}
.ci::placeholder{color:rgba(255,255,255,.2)}
.ci:focus{border-color:rgba(255,255,255,.4)}
.cb{background:transparent;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.6);font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.12em;padding:.75rem 2rem;cursor:pointer;transition:all .2s;text-transform:uppercase}
.cb:hover{border-color:rgba(255,255,255,.55);color:#fff;background:rgba(255,255,255,.04)}

/* cert cards */
.cert{padding:1.2rem 1.4rem;border:1px solid rgba(255,255,255,.06);margin-bottom:1px;background:#060a12;display:flex;align-items:center;gap:1.25rem;transition:background .2s}
.cert:hover{background:#0b1020}
.cert-ico{font-size:1.4rem;min-width:36px}
.cert-title{font-family:'Syne',sans-serif;font-weight:600;font-size:.95rem;color:rgba(255,255,255,.75)}
.cert-sub{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:rgba(255,255,255,.3);margin-top:3px}

/* summary highlight boxes */
.hbox{border:1px solid rgba(255,255,255,.07);padding:1.4rem 1.6rem;margin-bottom:1px;display:flex;gap:1.25rem;align-items:baseline;background:#060a12}
.hbox-num{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;color:#fff;min-width:80px}
.hbox-label{font-size:.95rem;color:rgba(255,255,255,.4);line-height:1.5}

/* resume download btn */
.dl-btn{display:inline-flex;align-items:center;gap:.65rem;border:1px solid rgba(255,255,255,.25);padding:.8rem 1.75rem;font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.1em;color:rgba(255,255,255,.65);text-decoration:none;text-transform:uppercase;transition:all .2s;margin-top:1.5rem;cursor:pointer;background:transparent}
.dl-btn:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.05)}

@media(max-width:620px){
  #pbox{padding:2rem 1.25rem}
  .ph1{font-size:2rem}
  .ghg{grid-template-columns:1fr}.ghg .w{grid-column:auto}
  .proj{grid-template-columns:1fr}.pstat{text-align:left}
  #bar .bar-c,.bar-r{display:none}
}
</style>
</head>
<body>
<div id="ci"></div>
<div id="co"></div>

<div id="intro">
  <div id="iname" class="i-name">Dev<span style="-webkit-text-stroke:2px rgba(255,255,255,0.2);color:transparent"> Sharma</span></div>
  <div id="irole" class="i-role">Machine Learning Engineer</div>
  <div id="ihint" class="i-hint">— click any node to explore the network —</div>
</div>

<canvas id="c"></canvas>
<div id="labels"></div>

<div id="bar">
  <span class="bar-l">Dev Sharma</span>
  <span class="bar-c">CLICK NODE TO OPEN · DRAG TO PAN · SCROLL TO ZOOM · R TO RESET</span>
  <span class="bar-r">ML Engineer · LPU 2023–27</span>
</div>

<div id="panel">
  <div id="pbg"></div>
  <div id="pbox">
    <button id="pcls">✕</button>
    <div id="pcontent"></div>
  </div>
</div>

<script>
// ═══ CURSOR ═══
const ci=document.getElementById('ci'),co=document.getElementById('co');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  ci.style.transform=`translate(${mx-3.5}px,${my-3.5}px)`;
});
(function cl(){rx+=(mx-rx)*.13;ry+=(my-ry)*.13;co.style.transform=`translate(${rx-16}px,${ry-16}px)`;requestAnimationFrame(cl)})();

// ═══ CANVAS ═══
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,dpr=1,T=0;
let panX=0,panY=0,tpx=0,tpy=0,zoom=1,tzoom=1;
let dragging=false,dsx=0,dsy=0,dpx=0,dpy=0,moved=false;
let hovered=null;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  layoutNodes();updateLabels();
}

// ═══ 6-LAYER NETWORK with 11 named section nodes ═══
// Layer 0 (input): INTRO, ABOUT, SKILLS, PROJECTS
// Layer 1 (h1): 6 hidden
// Layer 2 (h2): 5 hidden
// Layer 3 (h3): 4 hidden
// Layer 4 (h4): 5 hidden
// Layer 5 (output): CERTS, EXPERIENCE, COMPETITIVE, OPENSOURCE, BLOG, RESEARCH, CONTACT

const LAYERS=[
  {count:4, xf:.08},
  {count:6, xf:.24},
  {count:5, xf:.40},
  {count:5, xf:.56},
  {count:6, xf:.72},
  {count:5, xf:.90},  // more nodes to hold 5 output sections (2 go in layer 4)
];

// Assign section names to specific node positions
const SEC={
  '0-0':'INTRO',
  '0-1':'ABOUT',
  '0-2':'SKILLS',
  '0-3':'PROJECTS',
  '4-1':'CERTS',
  '4-2':'EXPERIENCE',
  '4-3':'COMPETITIVE',
  '5-0':'OPENSOURCE',
  '5-1':'BLOG',
  '5-2':'RESEARCH',
  '5-3':'CONTACT',
  '5-4':'RESUME',
};

const nodes=[];
LAYERS.forEach((L,li)=>{
  for(let ni=0;ni<L.count;ni++){
    const id=`${li}-${ni}`;
    const sec=SEC[id]||null;
    nodes.push({id,li,ni,wx:0,wy:0,r:sec?17:7,sec,act:0});
  }
});

const edges=[];
for(let li=0;li<LAYERS.length-1;li++){
  const A=nodes.filter(n=>n.li===li);
  const B=nodes.filter(n=>n.li===li+1);
  A.forEach(a=>B.forEach(b=>{
    edges.push({a,b,pulses:[],spd:.0028+Math.random()*.004,lp:Math.random()*250,iv:90+Math.random()*200,op:.04+Math.random()*.07});
  }));
}

function layoutNodes(){
  nodes.forEach(n=>{
    const L=LAYERS[n.li],cnt=L.count;
    const spread=Math.min(H*.7,cnt*90);
    n.wx=W*L.xf;
    n.wy=H/2-spread/2+n.ni*(spread/(cnt-1||1));
  });
}

function wtx(x){return x*zoom+panX}
function wty(y){return y*zoom+panY}

function hitNode(sx,sy){
  let best=null,bd=Infinity;
  nodes.forEach(n=>{
    const dx=wtx(n.wx)-sx,dy=wty(n.wy)-sy,d=Math.sqrt(dx*dx+dy*dy);
    if(d<(n.r+12)*zoom&&d<bd){bd=d;best=n;}
  });
  return best;
}

function draw(){
  T++;
  panX+=(tpx-panX)*.09;panY+=(tpy-panY)*.09;zoom+=(tzoom-zoom)*.07;
  ctx.clearRect(0,0,W,H);
  // grid
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.014)';ctx.lineWidth=1;
  const gs=55;
  for(let x=(panX%gs+gs)%gs;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=(panY%gs+gs)%gs;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.restore();

  // edges + pulses
  edges.forEach(e=>{
    if(T-e.lp>e.iv){e.pulses.push({t:0,s:e.spd*(.7+Math.random()*.6)});e.lp=T;}
    const x1=wtx(e.a.wx),y1=wty(e.a.wy),x2=wtx(e.b.wx),y2=wty(e.b.wy);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
    ctx.strokeStyle=`rgba(255,255,255,${e.op})`;ctx.lineWidth=1;ctx.stroke();
    e.pulses=e.pulses.filter(p=>{
      p.t=Math.min(1,p.t+p.s);
      const px=x1+(x2-x1)*p.t,py=y1+(y2-y1)*p.t;
      const a=Math.sin(p.t*Math.PI)*.6;
      const g=ctx.createRadialGradient(px,py,0,px,py,7);
      g.addColorStop(0,`rgba(210,235,255,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
      if(p.t>=1)e.b.act=Math.min(1,e.b.act+.5);
      return p.t<1;
    });
  });

  // nodes
  nodes.forEach(n=>{
    n.act*=.96;
    const x=wtx(n.wx),y=wty(n.wy),r=n.r*zoom,d=n.act,iS=!!n.sec,isH=n===hovered;
    // glow
    if(iS||d>.05||isH){
      const gr=r*(isH?4.5:3.2)+d*20;
      const g=ctx.createRadialGradient(x,y,0,x,y,gr);
      const a=(iS?.06:.025)+d*.16+(isH?.09:0);
      g.addColorStop(0,`rgba(200,225,255,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath();ctx.arc(x,y,gr,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    }
    if(iS){
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,255,255,${.22+d*.5+(isH?.3:0)})`;
      ctx.lineWidth=isH?2:1;ctx.stroke();
      ctx.fillStyle=`rgba(255,255,255,${.05+d*.13+(isH?.08:0)})`;ctx.fill();
      const b=Math.sin(T*.036+n.ni)*.5+.5;
      ctx.beginPath();ctx.arc(x,y,r+3+b*10,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,255,255,${.025+b*.04})`;ctx.lineWidth=1;ctx.stroke();
    } else {
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${.16+d*.4})`;ctx.fill();
    }
  });
}

// ═══ LABELS ═══
const labelEls={};
nodes.filter(n=>n.sec).forEach(n=>{
  const el=document.createElement('div');
  el.className='nlabel clickable';
  // Shorten some labels for the canvas
  const SHORT={INTRO:'INTRO',ABOUT:'ABOUT',SKILLS:'SKILLS',PROJECTS:'PROJECTS',CERTS:'CERTIFICATIONS',EXPERIENCE:'EXPERIENCE',COMPETITIVE:'COMPETITIVE',OPENSOURCE:'OPEN SOURCE',BLOG:'BLOG',RESEARCH:'RESEARCH',CONTACT:'CONTACT',RESUME:'RESUME ↓'};
  el.textContent=SHORT[n.sec]||n.sec;
  document.getElementById('labels').appendChild(el);
  labelEls[n.id]=el;
  el.addEventListener('mouseenter',()=>{hovered=n;el.classList.add('hover');co.style.width='50px';co.style.height='50px'});
  el.addEventListener('mouseleave',()=>{hovered=null;el.classList.remove('hover');co.style.width='32px';co.style.height='32px'});
  el.addEventListener('click',()=>openSec(n));
});

function updateLabels(){
  nodes.filter(n=>n.sec).forEach(n=>{
    const el=labelEls[n.id];if(!el)return;
    el.style.left=wtx(n.wx)+'px';
    el.style.top=(wty(n.wy)-n.r*zoom-18)+'px';
    el.style.opacity=zoom<.35?0:1;
  });
}

// ═══ LOOP ═══
(function loop(){draw();updateLabels();requestAnimationFrame(loop)})();
resize();window.addEventListener('resize',resize);

// ═══ INPUT ═══
canvas.addEventListener('mousemove',e=>{
  if(dragging){
    const dx=e.clientX-dsx,dy=e.clientY-dsy;
    if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
    tpx=dpx+dx;tpy=dpy+dy;return;
  }
  const hit=hitNode(e.clientX,e.clientY);
  if(hit!==hovered){
    if(hovered&&labelEls[hovered.id])labelEls[hovered.id].classList.remove('hover');
    hovered=hit;
    if(hit&&labelEls[hit.id])labelEls[hit.id].classList.add('hover');
    document.body.style.cursor=hit?'pointer':'default';
    co.style.width=hit?'50px':'32px';co.style.height=hit?'50px':'32px';
  }
});
canvas.addEventListener('mousedown',e=>{dragging=true;moved=false;dsx=e.clientX;dsy=e.clientY;dpx=tpx;dpy=tpy});
canvas.addEventListener('mouseup',e=>{
  if(!moved){const hit=hitNode(e.clientX,e.clientY);if(hit&&hit.sec)openSec(hit);}
  dragging=false;
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY>0?.91:1.1;
  const nz=Math.max(.28,Math.min(3,tzoom*f));
  tpx=e.clientX-(e.clientX-tpx)*(nz/tzoom);
  tpy=e.clientY-(e.clientY-tpy)*(nz/tzoom);
  tzoom=nz;
},{passive:false});

let tp0={x:0,y:0},tpan0={x:0,y:0},ltd=0,tMoved=false;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){tp0={x:e.touches[0].clientX,y:e.touches[0].clientY};tpan0={x:tpx,y:tpy};tMoved=false;}
  if(e.touches.length===2)ltd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1){const dx=e.touches[0].clientX-tp0.x,dy=e.touches[0].clientY-tp0.y;if(Math.abs(dx)+Math.abs(dy)>6)tMoved=true;tpx=tpan0.x+dx;tpy=tpan0.y+dy;}
  if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);tzoom=Math.max(.28,Math.min(3,tzoom*(d/ltd)));ltd=d;}
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(!tMoved&&e.changedTouches.length===1){const tc=e.changedTouches[0];const hit=hitNode(tc.clientX,tc.clientY);if(hit&&hit.sec)openSec(hit);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){tpx=0;tpy=0;tzoom=1;}
  if(e.key==='Escape')closePanel();
});
